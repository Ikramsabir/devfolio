<app-navbar-visitor></app-navbar-visitor>

<div class="register-container">
  <div class="register-card" *ngIf="!showWelcome">
    <h2>Inscription</h2>
    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Nom complet *</label>
        <input type="text" [(ngModel)]="nom" name="nom" required>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Mot de passe *</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>
      <div class="form-group">
        <label>Titre (ex: Développeur Full-Stack)</label>
        <input type="text" [(ngModel)]="titre" name="titre">
      </div>
      <div class="form-group">
        <label>Compétences (séparées par des virgules)</label>
        <input type="text" [(ngModel)]="competences" name="competences" placeholder="Angular, React, Node.js">
      </div>
      <button type="submit" class="btn-register">Créer mon compte</button>
      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    </form>
    <p class="login-link">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </div>
  <div class="welcome-card" *ngIf="showWelcome">
    <h2>🎉 Bienvenue dans notre communauté, {{ nom }} !</h2>
    <p>Préparez-vous à découvrir des projets incroyables et à partager votre talent avec le monde.</p>
    <div class="loader">Redirection vers l'accueil...</div>
  </div>
</div>
